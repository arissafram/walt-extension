# On every push to main: rebuild walt.zip and attach it to the GitHub Release
# for the version in manifest.json (creating that release if it's new).
# The download link always points at the newest one:
#   https://github.com/arissafram/walt-extension/releases/latest/download/walt.zip
name: Build walt.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: bash scripts/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version manifest.json)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version, new code: replace the zip in place.
            gh release upload "$TAG" dist/walt.zip --clobber
          else
            gh release create "$TAG" dist/walt.zip \
              --title "Walt $VERSION" \
              --notes "Download walt.zip, unzip it, and load the walt folder in chrome://extensions (Developer mode → Load unpacked)." \
              --latest
          fi
